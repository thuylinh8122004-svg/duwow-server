services:
  - type: web
    name: duwow
    runtime: node
    plan: starter            # gói có ổ đĩa lưu lâu dài; gói free sẽ mất dữ liệu khi khởi động lại
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false          # Render sẽ hỏi bạn nhập khi tạo
    disk:
      name: duwow-data
      mountPath: /var/data
      sizeGB: 1
